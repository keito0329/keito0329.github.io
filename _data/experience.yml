# Positions shown in the "Experience" section of the front page and the CV.
# Degrees go in _data/education.yml instead.
#
# Listed in the order written here, so keep the most recent first.
#
#   period  : free text, e.g. "2026.04 - present"
#   role_en : position, shown on /   and /cv/
#   role_ja : position, shown on /ja/ (falls back to role_en)
#   org_en  : organisation, shown on /   and /cv/
#   org_ja  : organisation, shown on /ja/ (falls back to org_en)
#   note_en : optional second line
#   note_ja : optional second line for /ja/ (falls back to note_en)
#   url     : optional link on the organisation name

- period: "2026.04 - present"
