# Degrees shown in the "Education" section of the front page and the CV.
#
# Listed in the order written here, so keep the most recent first.
# Shares its field names with _data/experience.yml, so both are rendered by
# _includes/home/entry-list.html.
#
#   period  : free text, e.g. "2026.04 - present"
#   role_en : degree or programme, shown on /   and /cv/
#   role_ja : degree or programme, shown on /ja/ (falls back to role_en)
#   org_en  : institution, shown on /   and /cv/
#   org_ja  : institution, shown on /ja/ (falls back to org_en)
#   note_en : optional second line, e.g. the laboratory
#   note_ja : optional second line for /ja/ (falls back to note_en)
#   url     : optional link on the institution name

- period: "2026.04 - present"
  role_en: "Master's programme in Information Science and Technology"
  role_ja: "修士課程"
  org_en: "Graduate School of Information Science and Technology, Hokkaido University"
  org_ja: "北海道大学 大学院情報科学院"
  note_en: "Media Dynamics Laboratory"
  note_ja: "メディアダイナミクス研究室"
  url: "https://www-lmd.ist.hokudai.ac.jp/"

